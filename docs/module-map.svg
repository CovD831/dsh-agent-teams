<text x="52" y="736" class="name">route.ts</text>
<text x="52" y="753" class="dim">③ ★ 分流：soft | hard | unmeasured</text>
<rect x="432" y="716" width="378" height="46" rx="5" class="card-inner"/>
<text x="444" y="736" class="name">verify.ts</text>
<text x="444" y="753" class="dim">④ ★ 验证闸：复用 test:gates / verify:fast</text>
<rect x="824" y="716" width="378" height="46" rx="5" class="card-inner"/>
<text x="836" y="736" class="name">promote.ts</text>
<text x="836" y="753" class="dim">⑤ 晋升：L2 profile → L1 代码</text>
<text x="40" y="782" class="note">★ 只读别人的：registry.list() · frictions/*.json · team.json      ★ 不写别人的状态</text>
<text x="24" y="826" class="h2">⑥ ★★★ 三条不许侵入的规则（用户硬约束）</text>
<text x="32" y="848" class="note">A. 别人 → evolution：★ 只许 import src/evolution/index.ts（不许深入 collect.ts 这类路径）</text>
<text x="32" y="868" class="note">B. evolution → 别人：★ 只读。要影响别人 ⇒ 发信号给宿主，不直接改</text>
<text x="32" y="888" class="note">C. 采集点：★ 别的模块【不许】主动调用采集 —— 由宿主在【既有汇合点】调用一次</text>
<text x="24" y="916" class="dim">★ 而 confidence.ts（飞轮公式 · 双计数 · 三阈值）保持纯算法，被 evolution 调用 —— 它现在零读者</text>
