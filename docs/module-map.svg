<rect x="40" y="660" width="378" height="46" rx="5" class="card-inner"/>
<text x="52" y="680" class="name">types.ts</text>
<text x="52" y="697" class="dim">信号 / 记录 / 裁决的形状</text>
<rect x="432" y="660" width="378" height="46" rx="5" class="card-inner"/>
<text x="444" y="680" class="name">collect.ts</text>
<text x="444" y="697" class="dim">① 采集：observe(signal)</text>
<rect x="824" y="660" width="378" height="46" rx="5" class="card-inner"/>
