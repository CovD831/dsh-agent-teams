<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1480" width="1720" height="1480" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowHard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title   { font-size: 26px; font-weight: 700; fill: #0f172a; }
      .sub     { font-size: 14px; fill: #64748b; }
      .lbl     { font-size: 13px; fill: #334155; }
      .lblsm   { font-size: 11px; fill: #64748b; }
      .lblw    { font-size: 11px; fill: #ffffff; }
      .node    { stroke-width: 2; rx: 8; }
      .nt      { font-size: 15px; font-weight: 700; }
      .ns      { font-size: 11px; }
      .band    { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 10; }
      .bandt   { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: .06em; }
      .edge    { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .edgeHard{ fill: none; stroke: #dc2626; stroke-width: 2.4; marker-end: url(#arrowHard); }
      .edgeSoft{ fill: none; stroke: #94a3b8; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arrowSoft); }
      .note    { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1; rx: 6; }
      .notet   { font-size: 11px; fill: #78350f; }
    </style>
  </defs>

  <rect width="1720" height="1480" fill="#ffffff"/>
  <text x="40" y="46" class="title">AgentTeams 重构总览 DAG · v3</text>
  <text x="40" y="70" class="sub">8 条一等线 · 依据 24 条对抗性审查 finding 修正 · HEAD b8f357e</text>
  <text x="40" y="90" class="sub">用户裁定：① C 线要做 ② 所有孤岛必须接线或删掉 ③ tools.ts 拆分接受</text>

  <!-- ============ 图例 ============ -->
  <rect x="1270" y="24" width="410" height="106" class="note"/>
  <text x="1288" y="46" class="notet" font-weight="700">图例</text>
  <line x1="1288" y1="62" x2="1330" y2="62" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrowHard)"/>
  <text x="1340" y="66" class="notet">硬依赖（前置未完成则不可开工）</text>
  <line x1="1288" y1="82" x2="1330" y2="82" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowSoft)"/>
  <text x="1340" y="86" class="notet">软依赖（共用接口/形状，须先对齐）</text>
  <rect x="1288" y="96" width="14" height="14" fill="#fee2e2" stroke="#dc2626" stroke-width="1.4" rx="3"/>
  <text x="1310" y="107" class="notet">红灯 = 产品缺陷，最高优先级</text>
  <rect x="1420" y="96" width="14" height="14" fill="#fef3c7" stroke="#d97706" stroke-width="1.4" rx="3"/>
  <text x="1442" y="107" class="notet">用户裁定输入</text>

  <!-- ============ 批次带 ============ -->
  <rect x="30" y="112" width="1660" height="318" class="band"/>
  <text x="46" y="134" class="bandt">批次 1 · 可立刻并行（无硬依赖）</text>

  <rect x="30" y="452" width="1660" height="268" class="band"/>
  <text x="46" y="474" class="bandt">批次 2 · 依赖批次 1</text>

  <rect x="30" y="742" width="1660" height="220" class="band"/>
  <text x="46" y="764" class="bandt">批次 3 · 依赖批次 2 定稿</text>

  <!-- ============ 工装与效率（新增） ============ -->
  <rect x="30" y="742" width="1660" height="0" class="band" opacity="0"/>
  <rect x="30" y="984" width="1660" height="316" class="band"/>
  <text x="46" y="1006" class="bandt">工装缺陷 3 条（用户裁定：后续任务必修） ＋ P 线 · 效率（用户裁定：丙）</text>

  <!-- T1 sourceTaskId 挂错 -->
  <rect x="60" y="1024" width="300" height="112" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="78" y="1050" class="nt" fill="#991b1b">T1 · sourceTaskId 挂错</text>
  <text x="78" y="1070" class="ns" fill="#b91c1c">finding 被挂到被审对象上</text>
  <text x="78" y="1086" class="ns" fill="#b91c1c">后果：t28 被【重复派发】跑了两遍</text>
  <text x="78" y="1102" class="ns" fill="#b91c1c">t28.sourceTaskId=t24（实出自 t25）</text>
  <text x="78" y="1122" class="lblsm" fill="#dc2626">★ 损害：正确性 + 效率</text>

  <!-- T2 输入不过桥 -->
  <rect x="390" y="1024" width="300" height="112" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="408" y="1050" class="nt" fill="#991b1b">T2 · 输入不过桥</text>
  <text x="408" y="1070" class="ns" fill="#b91c1c">worktree 是干净检出，未提交的</text>
  <text x="408" y="1086" class="ns" fill="#b91c1c">输入文件它【拿不到】</text>
  <text x="408" y="1102" class="ns" fill="#b91c1c">20/27 契约引用 docs/ ⇒ 全受影响</text>
  <text x="408" y="1122" class="lblsm" fill="#16a34a">已应急修：提交 25e7e2b（根因未修）</text>

  <!-- T3 契约行号 -->
  <rect x="720" y="1024" width="300" height="112" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="738" y="1050" class="nt" fill="#991b1b">T3 · 契约用行号锚定</text>
  <text x="738" y="1070" class="ns" fill="#b91c1c">文件一改，行号全部错位</text>
  <text x="738" y="1086" class="ns" fill="#b91c1c">已连续三次发生（t28/t34/…）</text>
  <text x="738" y="1102" class="ns" fill="#b91c1c">成员被迫按语义核对</text>
  <text x="738" y="1122" class="lblsm" fill="#dc2626">修法：改引【锚点文本】</text>

  <!-- P 线 效率 -->
  <rect x="1050" y="1024" width="610" height="112" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="1068" y="1050" class="nt" fill="#92400e">P · 效率（★ 用户裁定：丙 = 快环 + 全环）</text>
  <text x="1068" y="1070" class="ns" fill="#b45309">实测：verify:gates 39.8s，其余 21 步全亚秒级；最贵 3 夹具占 55.3s</text>
  <text x="1068" y="1086" class="ns" fill="#b45309">15 个夹具【扫全仓】⇒ 成本 O(仓库规模)（这是"越加越慢"的结构性根因）</text>
  <text x="1068" y="1102" class="ns" fill="#b45309">P1 分快环/全环 · P2 按 inScope 选夹具 · P4 判据成本可见 · P5 全仓夹具读取缓存</text>
  <text x="1068" y="1122" class="lblsm" fill="#dc2626">★ P3 存量红分流 —— 唯一需用户拍板（与 backtest「基线先绿」冲突）</text>

  <!-- 横切关注点（下移） -->
  <rect x="30" y="1310" width="1660" height="0" class="band" opacity="0"/>

  <!-- ================= 批次 1 ================= -->
  <!-- P0 -->
  <rect x="60" y="160" width="230" height="88" class="node" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="78" y="188" class="nt" fill="#3730a3">P0 · 解耦</text>
  <text x="78" y="208" class="ns" fill="#4338ca">18 处源文本断言 → 语义查找</text>
  <text x="78" y="224" class="ns" fill="#4338ca">★ 原引用的函数不存在，须重新设计</text>
  <text x="78" y="240" class="lblsm">一切 client 改动的前置</text>

  <!-- D1 (产品缺陷) -->
  <rect x="330" y="160" width="240" height="88" class="node" fill="#fee2e2" stroke="#dc2626"/>
  <text x="348" y="188" class="nt" fill="#991b1b">D1 · 修产品缺陷</text>
  <text x="348" y="208" class="ns" fill="#b91c1c">gateIdFromMessage 只取首个 [id]</text>
  <text x="348" y="224" class="ns" fill="#b91c1c">6 调用点 · 语料 18/384 已受害</text>
  <text x="348" y="240" class="lblsm" fill="#dc2626">t30 进行中</text>

  <!-- A -->
  <rect x="610" y="160" width="230" height="88" class="node" fill="#dbeafe" stroke="#2563eb"/>
  <text x="628" y="188" class="nt" fill="#1e40af">A · 读数出口</text>
  <text x="628" y="208" class="ns" fill="#1d4ed8">/state 送 4 类：聚合+活跃+异常+未检查</text>
  <text x="628" y="224" class="ns" fill="#1d4ed8">载荷上界：活跃 4 / 异常 10–12</text>
  <text x="628" y="240" class="lblsm">解锁 B（今天 client 收不到判据数据）</text>

  <!-- M -->
  <rect x="880" y="160" width="230" height="88" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="898" y="188" class="nt" fill="#166534">M · 模块拆分</text>
  <text x="898" y="208" class="ns" fill="#15803d">quality-gates 2520 行 · tools 2227 行</text>
  <text x="898" y="224" class="ns" fill="#15803d">须「集合相等」证明（非"测试绿了"）</text>
  <text x="898" y="240" class="lblsm">M1 先出模块地图</text>

  <!-- N -->
  <rect x="1150" y="160" width="240" height="88" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1168" y="188" class="nt" fill="#6b21a8">N · 盘局 / 辅助支线</text>
  <text x="1168" y="208" class="ns" fill="#7e22ce">39 个非测试脚本平铺在 scripts/</text>
  <text x="1168" y="224" class="ns" fill="#7e22ce">8 个机制全在 scripts/，非 src/</text>
  <text x="1168" y="240" class="lblsm">N1 先出盘局地图</text>

  <!-- O (孤岛) -->
  <rect x="1430" y="160" width="230" height="88" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="1448" y="188" class="nt" fill="#92400e">O · 孤岛普查</text>
  <text x="1448" y="208" class="ns" fill="#b45309">88 / 561 导出零引用（15.7%）</text>
  <text x="1448" y="224" class="ns" fill="#b45309">client 占 61（69%）</text>
  <text x="1448" y="240" class="lblsm" fill="#d97706">★ 用户 R2：接线或删掉</text>

  <!-- G -->
  <rect x="60" y="290" width="230" height="80" class="node" fill="#cffafe" stroke="#0891b2"/>
  <text x="78" y="316" class="nt" fill="#155e75">G · 交付回流</text>
  <text x="78" y="336" class="ns" fill="#0e7490">实测发生两次（t18 / t20）</text>
  <text x="78" y="352" class="ns" fill="#0e7490">提案已写，未实现</text>

  <!-- 批次1 内的软依赖 -->
  <path class="edgeSoft" d="M 570 204 C 592 204, 592 204, 608 204"/>
  <text x="574" y="196" class="lblsm" fill="#94a3b8">软依赖</text>

  <!-- ================= 批次 2 ================= -->
  <!-- B -->
  <rect x="610" y="500" width="250" height="96" class="node" fill="#dbeafe" stroke="#2563eb"/>
  <text x="628" y="528" class="nt" fill="#1e40af">B · 视觉重构</text>
  <text x="628" y="548" class="ns" fill="#1d4ed8">判据管线图 · 固定画布 29 行</text>
  <text x="628" y="564" class="ns" fill="#1d4ed8">三类展开（活跃/异常/未检查 = 留痕）</text>
  <text x="628" y="580" class="ns" fill="#1d4ed8">B0.1 符号满射表（★ 废弃 ○）</text>
  <text x="628" y="594" class="lblsm">B0.5 B4 退回「未判定」</text>

  <!-- C (用户裁定要做) -->
  <rect x="900" y="500" width="240" height="96" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="918" y="528" class="nt" fill="#92400e">C · 辅助支线收拢</text>
  <text x="918" y="548" class="ns" fill="#b45309">★ 用户 R1：要做</text>
  <text x="918" y="564" class="ns" fill="#b45309">C0 先接上那条断链</text>
  <text x="918" y="580" class="ns" fill="#b45309">C1/C2 降级为「更整齐」</text>
  <text x="918" y="594" class="lblsm">N4：动态 import vs 移进 src</text>

  <!-- M2-M4 -->
  <rect x="1180" y="500" width="220" height="96" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1198" y="528" class="nt" fill="#166534">M2–M4 · 实际拆分</text>
  <text x="1198" y="548" class="ns" fill="#15803d">依 M1 结论</text>
  <text x="1198" y="564" class="ns" fill="#15803d">★ 用户 R3：接受</text>
  <text x="1198" y="580" class="ns" fill="#15803d">代价：加大上游冲突面</text>

  <!-- N2-N4 -->
  <rect x="1430" y="500" width="230" height="96" class="node" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1448" y="528" class="nt" fill="#6b21a8">N2–N4 · 收拢</text>
  <text x="1448" y="548" class="ns" fill="#7e22ce">分层 scripts/{dev,release,harness}</text>
  <text x="1448" y="564" class="ns" fill="#7e22ce">给运行时机制找不靠 pluginRoot 的路</text>
  <text x="1448" y="580" class="ns" fill="#7e22ce">C0 接断链（readExperienceDispatch）</text>

  <!-- D2/D4 -->
  <rect x="60" y="500" width="230" height="96" class="node" fill="#f1f5f9" stroke="#64748b"/>
  <text x="78" y="528" class="nt" fill="#334155">D2 · 判据活性</text>
  <text x="78" y="548" class="ns" fill="#475569">9 条判据：很稳 vs 从不生效</text>
  <text x="78" y="564" class="ns" fill="#475569">依 D1 的读数才判得了</text>
  <text x="78" y="580" class="ns" fill="#94a3b8">D4 建议删除（t27）</text>
  <text x="78" y="594" class="lblsm">D3 admission 三条：待判</text>

  <!-- 批次1 → 批次2 的边 -->
  <path class="edgeHard" d="M 710 248 L 710 496"/>
  <text x="718" y="380" class="lbl" fill="#dc2626">硬：无解耦会假红</text>
  <path class="edgeHard" d="M 840 204 C 900 300, 960 420, 1000 496"/>
  <text x="892" y="330" class="lbl" fill="#dc2626">硬：无 A 画不出图</text>
  <path class="edgeHard" d="M 995 248 C 1010 360, 1060 450, 1090 496"/>
  <text x="1004" y="400" class="lbl" fill="#dc2626">硬：M1 → M2</text>
  <path class="edgeHard" d="M 1270 248 C 1285 360, 1330 450, 1345 496"/>
  <text x="1279" y="392" class="lbl" fill="#dc2626">硬：N1 → N2</text>
  <path class="edgeHard" d="M 1545 248 L 1545 496"/>
  <text x="1553" y="380" class="lbl" fill="#dc2626">硬：清单 → 处置</text>
  <path class="edgeHard" d="M 400 248 C 430 380, 520 460, 606 540"/>
  <text x="410" y="330" class="lbl" fill="#dc2626">硬：D1 → D2</text>

  <!-- ================= 批次 3 ================= -->
  <rect x="640" y="790" width="240" height="88" class="node" fill="#e2e8f0" stroke="#64748b"/>
  <text x="658" y="818" class="nt" fill="#334155">E · 结构重构</text>
  <text x="658" y="838" class="ns" fill="#475569">L1 纯搬运（CSS 61KB 切分）</text>
  <text x="658" y="854" class="ns" fill="#475569">L2 改行为（去 !important）</text>
  <text x="658" y="870" class="lblsm">★ t27 建议：B 定稿后再决定立项</text>

  <path class="edgeHard" d="M 735 596 L 735 786"/>
  <text x="743" y="690" class="lbl" fill="#dc2626">硬：B 定稿前搬代码是白搬</text>
  <path class="edgeHard" d="M 1290 596 C 1180 660, 980 700, 884 812"/>
  <text x="1060" y="680" class="lbl" fill="#dc2626">硬：M 先拆完，E 才不返工</text>

  <!-- ================= 横切 ================= -->
  <rect x="60" y="1340" width="300" height="96" class="node" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="78" y="1366" class="nt" fill="#0369a1">审查臂 · 每条线独立复核</text>
  <text x="78" y="1386" class="ns" fill="#0284c7">不复用实现者脚本</text>
  <text x="78" y="1402" class="ns" fill="#0284c7">已抓出：1 个 blocker（计划）</text>
  <text x="78" y="1420" class="lblsm">+ 2 个产品缺陷</text>

  <rect x="390" y="1340" width="300" height="96" class="node" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="408" y="1366" class="nt" fill="#0369a1">三态纪律</text>
  <text x="408" y="1386" class="ns" fill="#0284c7">skipped ≠ ok（不许合流）</text>
  <text x="408" y="1402" class="ns" fill="#0284c7">折叠必须留痕（未检查）</text>
  <text x="408" y="1420" class="lblsm">空转的验收 = 通过的验收（同形）</text>

  <rect x="720" y="1340" width="300" height="96" class="node" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="738" y="1366" class="nt" fill="#0369a1">交付回流</text>
  <text x="738" y="1386" class="ns" fill="#0284c7">worktree 提交须回流队长工作区</text>
  <text x="738" y="1402" class="ns" fill="#0284c7">实测缺失 2 次，尚无判据</text>
  <text x="738" y="1420" class="lblsm">G 线</text>

  <rect x="1050" y="1340" width="300" height="96" class="node" fill="#ffffff" stroke="#0ea5e9"/>
  <text x="1068" y="1366" class="nt" fill="#0369a1">判据效能读数</text>
  <text x="1068" y="1386" class="ns" fill="#0284c7">384 条真实卡点 · 187 可归因（48.7%）</text>
  <text x="1068" y="1402" class="ns" fill="#0284c7">self 378 / escalate 6（98.4% 自消化）</text>
  <text x="1068" y="1420" class="lblsm">D 线的输入</text>

