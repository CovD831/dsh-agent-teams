<rect x="24" y="622" width="1132" height="96" rx="6" class="card-note"/>
<text x="40" y="648" class="h2">⑥ 本轮反复出现的三个形态（已记账）</text>
<text x="40" y="670" class="note">A. 「它被删了」与「它从来没做过」在报告里同形  →  t75/t76 两条判据</text>
<text x="40" y="688" class="note">B. 「改了但没报」与「没改」同形              →  探针别名保留（t80）</text>
<text x="40" y="706" class="note">C. 「写了但没跑」与「跑了且通过」同形          →  对拍臂必须落到跑者里（t83）</text>
<text x="24" y="742" class="dim">⑦ 而"契约由实测推翻"发生了 6 次 —— 其中 4 次是队长的规格错，由成员查出后先报不动手</text>
<text x="24" y="762" class="dim">    · rejectOnContractGates 通过时不返回 { gates }（我引用的那两处是卡点台账的）</text>
<text x="24" y="780" class="dim">    · UI 四态逻辑整体在 outOfScope 文件里（我落点判断错）</text>
<text x="24" y="798" class="dim">    · types.ts 写不出我指定的类型（它是零 import 叶子，两条臂逐字钉住）</text>
<text x="24" y="816" class="dim">    · GateEvaluationRecord 的两份声明（我去重时对象是零份，因为 S1 已被我删）</text>
